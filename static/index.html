<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Generator Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TTS Generator Editor</h1>
        <p class="subtitle">텍스트 → PCM 변환 파이프라인 시각화</p>
    </header>

    <main>
        <section class="input-section">
            <div class="input-group">
                <label for="text-input">텍스트 입력</label>
                <textarea id="text-input" placeholder="여기에 텍스트를 입력하세요 (예: 안녕하세요)" rows="3"></textarea>
            </div>
            <div class="controls">
                <select id="language-select">
                    <option value="ko" selected>한국어</option>
                    <option value="en" disabled>English (준비 중)</option>
                </select>
                <button id="synthesize-btn" onclick="synthesize()">합성 실행</button>
            </div>
        </section>

        <section class="tuning-section">
            <h2>튜닝 파라미터</h2>
            <div class="tuning-grid">
                <div class="tuning-group">
                    <label>기본 피치 (Hz)
                        <span class="tuning-value" id="pitch-value">150</span>
                    </label>
                    <input type="range" id="pitch-slider" min="80" max="300" value="150" step="5" oninput="updateTuningValue('pitch')">
                    <div class="range-labels"><span>80</span><span>300</span></div>
                </div>
                <div class="tuning-group">
                    <label>속도
                        <span class="tuning-value" id="speed-value">1.0</span>x
                    </label>
                    <input type="range" id="speed-slider" min="0.5" max="2.0" value="1.0" step="0.1" oninput="updateTuningValue('speed')">
                    <div class="range-labels"><span>0.5x</span><span>2.0x</span></div>
                </div>
                <div class="tuning-group">
                    <label>볼륨
                        <span class="tuning-value" id="volume-value">1.0</span>
                    </label>
                    <input type="range" id="volume-slider" min="0.1" max="2.0" value="1.0" step="0.1" oninput="updateTuningValue('volume')">
                    <div class="range-labels"><span>0.1</span><span>2.0</span></div>
                </div>
            </div>
            <div class="preset-controls">
                <button onclick="applyPreset('default')">기본값</button>
                <button onclick="applyPreset('high')">높은 목소리</button>
                <button onclick="applyPreset('low')">낮은 목소리</button>
                <button onclick="applyPreset('fast')">빠르게</button>
                <button onclick="applyPreset('slow')">느리게</button>
                <button onclick="saveCustomPreset()" class="btn-secondary">현재 값 저장</button>
                <button onclick="loadCustomPreset()" class="btn-secondary" id="load-preset-btn" disabled>저장된 값 불러오기</button>
            </div>
        </section>

        <section class="pipeline-section">
            <h2>파이프라인</h2>
            <div id="pipeline-stages" class="pipeline-container">
            </div>
        </section>

        <section class="result-section" id="result-section" style="display:none;">
            <h2>파이프라인 결과</h2>
            <div id="pipeline-results" class="results-container"></div>
        </section>

        <section class="audio-section" id="audio-section" style="display:none;">
            <h2>오디오 출력</h2>
            <div class="audio-controls">
                <div class="audio-buttons">
                    <button id="play-btn" disabled>재생</button>
                    <button id="ab-btn" onclick="toggleABCompare()" disabled style="display:none;">A/B 비교</button>
                </div>
                <canvas id="waveform-canvas" width="800" height="200"></canvas>
            </div>
        </section>
    </main>

    <footer>
        <p>TTS Learning Project — Rust + Web</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
